[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tasker"
version = "0.1.0"
description = "Deterministic multilevel agent policy enforcement and orchestration CLI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
mt = "src.cli.main:main"

[tool.setuptools]
package-dir = {"multi_tasker" = "src", "multi_tasker.policy_templates" = "policy", "src" = "src"}
packages = [
    "multi_tasker",
    "multi_tasker.domain",
    "multi_tasker.checkers",
    "multi_tasker.orchestrator",
    "multi_tasker.cli",
    "multi_tasker.policy_templates",
    "src",
    "src.domain",
    "src.checkers",
    "src.orchestrator",
    "src.cli",
]

[tool.setuptools.package-data]
"multi_tasker.policy_templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
ignore_missing_imports = true

