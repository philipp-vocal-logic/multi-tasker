[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tasker"
version = "0.1.0"
description = "Deterministic multilevel agent policy enforcement and orchestration CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Philipp", email = "274027022+philipp-vocal-logic@users.noreply.github.com" },
]
keywords = ["agents", "orchestration", "policy", "traceability", "worktree", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/philipp-vocal-logic/multi-tasker"
Repository = "https://github.com/philipp-vocal-logic/multi-tasker.git"
Issues = "https://github.com/philipp-vocal-logic/multi-tasker/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
mt = "multi_tasker.cli.main:main"

[tool.setuptools]
package-dir = {"multi_tasker" = "src/multi_tasker", "multi_tasker.policy_templates" = "policy"}
packages = [
    "multi_tasker",
    "multi_tasker.domain",
    "multi_tasker.checkers",
    "multi_tasker.orchestrator",
    "multi_tasker.cli",
    "multi_tasker.policy_templates",
]

[tool.setuptools.package-data]
"multi_tasker.policy_templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
ignore_missing_imports = true

