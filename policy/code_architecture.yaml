# Code Architecture & Layer Boundary Policy
# Enforced deterministically by `mt check architecture` via Python stdlib `ast` import-graph analysis.
version: 1

dependency_rules:
  forbid_circular_imports: true
  forbid_src_importing_tests: true

allowed_third_party_packages:
  # Stdlib-first; only stable, approved packages may be imported in src/**
  - "yaml"
  - "jsonschema"
  - "pytest"
  - "multi_tasker"

layers:
  - name: "domain"
    description: "Pure data structures, artifact models, state machines, and domain errors."
    paths:
      - "src/multi_tasker/__init__.py"
      - "src/multi_tasker/domain/**"
    allowed_internal_imports:
      - "multi_tasker.domain"
    forbidden_internal_imports:
      - "multi_tasker.checkers"
      - "multi_tasker.orchestrator"
      - "multi_tasker.cli"
      - "tests"

  - name: "checkers"
    description: "Deterministic CLI validators (permissions, schemas, glossary, limits, clean_code, architecture, traceability)."
    paths:
      - "src/multi_tasker/checkers/**"
    allowed_internal_imports:
      - "multi_tasker.domain"
      - "multi_tasker.checkers"
    forbidden_internal_imports:
      - "multi_tasker.orchestrator"
      - "multi_tasker.cli"
      - "tests"

  - name: "orchestrator"
    description: "Clean Worktree manager, MergeGate runner, parallel Task scheduler, and Escalation router."
    paths:
      - "src/multi_tasker/orchestrator/**"
    allowed_internal_imports:
      - "multi_tasker.domain"
      - "multi_tasker.checkers"
      - "multi_tasker.orchestrator"
    forbidden_internal_imports:
      - "multi_tasker.cli"
      - "tests"

  - name: "cli"
    description: "Thin CLI entrypoints (`mt initialize`, `mt check`, `mt schedule`, `mt impact`, `mt intent`, `mt approve`, `mt run`, `mt resolve`, `mt trace`, `mt documentation`, `mt prompt`)."
    paths:
      - "src/multi_tasker/cli/**"
    allowed_internal_imports:
      - "multi_tasker.domain"
      - "multi_tasker.checkers"
      - "multi_tasker.orchestrator"
      - "multi_tasker.cli"
    forbidden_internal_imports:
      - "tests"

  - name: "tests"
    description: "Executable TestContracts decorated with @traces(REQ, AC, SPEC)."
    paths:
      - "tests/**"
    allowed_internal_imports:
      - "multi_tasker.domain"
      - "multi_tasker.checkers"
      - "multi_tasker.orchestrator"
      - "multi_tasker.cli"
      - "tests"
    forbidden_internal_imports: []
