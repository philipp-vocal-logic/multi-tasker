# Artifact Frontmatter Schemas, Section Structure & Lifecycle Transitions Policy
# Enforced deterministically by `mt check schemas` via PyYAML and stdlib JSON-Schema/section validation.
version: 1

state_transitions:
  INT:
    open: ["processing", "processed"]
    processing: ["open", "processed"]
    processed: []
  REQ:
    draft: ["in_review", "awaiting_human", "blocked", "approved"]
    in_review: ["draft", "blocked", "awaiting_human", "approved"]
    awaiting_human: ["draft", "approved"]
    blocked: ["draft"]
    approved: ["needs_update", "deprecated"]
    needs_update: ["draft"]
    deprecated: []
  SPEC:
    draft: ["in_review", "blocked", "approved"]
    in_review: ["draft", "blocked", "approved"]
    blocked: ["draft"]
    approved: ["needs_update", "deprecated"]
    needs_update: ["draft"]
    deprecated: []
  TASK:
    planned: ["ready", "in_progress"]
    ready: ["in_progress"]
    in_progress: ["planned", "in_review", "blocked", "done"]
    in_review: ["in_progress", "blocked", "done"]
    blocked: ["planned", "ready"]
    done: ["needs_update"]
    needs_update: ["planned"]
  ESC:
    open: ["routed_to_agent", "awaiting_human", "resolved"]
    routed_to_agent: ["awaiting_human", "resolved"]
    awaiting_human: ["resolved"]
    resolved: []
  DEC:
    draft: ["approved"]
    approved: ["superseded"]
    superseded: []

artifacts:
  INT:
    max_body_words: 150

  REQ:
    max_acceptance_criteria: 5
    max_criterion_words: 45
    required_sections:
      - "Statement"
      - "Impact Analysis"
    sections:
      Statement:
        max_words: 60
        max_lines: 6
      Impact Analysis:
        max_words: 120
        max_lines: 12

  SPEC:
    required_sections:
      - "Design Overview"
      - "Public Interfaces"
      - "Test Contract Mapping"
    sections:
      Design Overview:
        max_words: 150
        max_lines: 15
      Public Interfaces:
        max_lines: 60
      Test Contract Mapping:
        max_words: 150
        max_lines: 20

  TASK:
    max_write_files: 8
    max_required_files: 10
    required_sections:
      - "Objective"
      - "Scoped Instructions"
    sections:
      Objective:
        max_words: 50
        max_lines: 5
      Scoped Instructions:
        max_words: 120
        max_lines: 15

  ESC:
    required_sections:
      - "Blocking Problem"
    sections:
      Blocking Problem:
        max_words: 80
        max_lines: 8
        single_paragraph_only: true

  DEC:
    required_sections:
      - "Resolution"
    sections:
      Resolution:
        max_words: 100
        max_lines: 10

  REV:
    max_finding_words: 30
    max_findings_per_record: 10

schemas:
  INT:
    path_glob: "artifacts/intents/INT-*.md"
    json_schema:
      type: "object"
      required: ["id", "status", "created_at"]
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^INT-[0-9]{3,}$" }
        status: { type: "string", enum: ["open", "processing", "processed"] }
        created_at: { type: "string" }

  REQ:
    path_glob: "artifacts/requirements/REQ-*.md"
    json_schema:
      type: "object"
      required: ["id", "title", "status", "traces_to", "decisions", "acceptance_criteria", "version"]
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^REQ-[0-9]{3,}$" }
        title: { type: "string", minLength: 5, maxLength: 100 }
        status:
          type: "string"
          enum: ["draft", "in_review", "awaiting_human", "blocked", "approved", "needs_update", "deprecated"]
        traces_to:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^INT-[0-9]{3,}$" }
        decisions:
          type: "array"
          items: { type: "string", pattern: "^DEC-[0-9]{3,}$" }
        supersedes:
          type: "array"
          items: { type: "string", pattern: "^REQ-[0-9]{3,}$" }
        acceptance_criteria:
          type: "array"
          minItems: 1
          maxItems: 5
          items:
            type: "object"
            required: ["id", "given", "when", "then"]
            additionalProperties: false
            properties:
              id: { type: "string", pattern: "^AC-[0-9]{2,}$" }
              given: { type: "string", minLength: 3 }
              when: { type: "string", minLength: 3 }
              then: { type: "string", minLength: 3 }
        version: { type: "integer", minimum: 1 }

  SPEC:
    path_glob: "artifacts/specifications/SPEC-*.md"
    json_schema:
      type: "object"
      required: ["id", "title", "status", "traces_to", "covers_criteria", "decisions", "target_files"]
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^SPEC-[0-9]{3,}$" }
        title: { type: "string", minLength: 5, maxLength: 100 }
        status:
          type: "string"
          enum: ["draft", "in_review", "blocked", "approved", "needs_update", "deprecated"]
        traces_to:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^REQ-[0-9]{3,}$" }
        covers_criteria:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^REQ-[0-9]{3,}:AC-[0-9]{2,}$" }
        decisions:
          type: "array"
          items: { type: "string", pattern: "^DEC-[0-9]{3,}$" }
        target_files:
          type: "object"
          required: ["tests", "implementation"]
          additionalProperties: false
          properties:
            tests:
              type: "array"
              minItems: 1
              items: { type: "string", pattern: "^tests/.+\\.py$" }
            implementation:
              type: "array"
              minItems: 1
              items: { type: "string", pattern: "^src/.+\\.py$" }

  TASK:
    path_glob: "artifacts/tasks/TASK-*.md"
    json_schema:
      type: "object"
      required:
        - "id"
        - "title"
        - "type"
        - "status"
        - "traces_to"
        - "depends_on"
        - "required_files"
        - "write_files"
        - "verification_cmd"
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^TASK-[0-9]{3,}$" }
        title: { type: "string", minLength: 5, maxLength: 100 }
        type: { type: "string", enum: ["test_contract", "implementation"] }
        status:
          type: "string"
          enum: ["planned", "ready", "in_progress", "in_review", "blocked", "done", "needs_update"]
        traces_to:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^(REQ|SPEC)-[0-9]{3,}$" }
        depends_on:
          type: "array"
          items: { type: "string", pattern: "^TASK-[0-9]{3,}$" }
        required_files:
          type: "array"
          maxItems: 10
          items: { type: "string" }
        write_files:
          type: "array"
          minItems: 1
          maxItems: 8
          items: { type: "string" }
        verification_cmd: { type: "string", minLength: 3 }
        model: { type: "string", minLength: 3 }
        execution_environment: { type: "string", minLength: 2 }

  ESC:
    path_glob: "artifacts/escalations/ESC-*.md"
    json_schema:
      type: "object"
      required:
        - "id"
        - "source_agent"
        - "task_or_stage"
        - "affected_artifacts"
        - "reason_category"
        - "status"
        - "resolved_by"
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^ESC-[0-9]{3,}$" }
        source_agent:
          type: "string"
          enum: ["requirement-agent", "specification-agent", "planner-agent", "worker-agent", "orchestrator"]
        task_or_stage: { type: "string" }
        affected_artifacts:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^(INT|REQ|SPEC|TASK)-[0-9]{3,}$" }
        reason_category:
          type: "string"
          enum: ["ambiguity", "rule_conflict", "infeasible_scope", "test_contract_defect", "review_exhausted"]
        status: { type: "string", enum: ["open", "routed_to_agent", "awaiting_human", "resolved"] }
        resolved_by:
          type: ["string", "null"]
          pattern: "^(DEC|TASK)-[0-9]{3,}$"

  DEC:
    path_glob: "artifacts/decisions/DEC-*.md"
    json_schema:
      type: "object"
      required: ["id", "resolves", "applies_to", "status"]
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^DEC-[0-9]{3,}$" }
        resolves: { type: "string", pattern: "^ESC-[0-9]{3,}$" }
        applies_to:
          type: "array"
          minItems: 1
          items: { type: "string", pattern: "^(REQ|SPEC|TASK)-[0-9]{3,}$" }
        status: { type: "string", enum: ["draft", "approved", "superseded"] }

  REV:
    path_glob: "artifacts/reviews/REV-*.md"
    json_schema:
      type: "object"
      required: ["id", "target_artifacts", "stage", "verdict", "findings"]
      additionalProperties: false
      properties:
        id: { type: "string", pattern: "^REV-[A-Z0-9-]+$" }
        target_artifacts:
          type: "array"
          minItems: 1
          items: { type: "string" }
        stage:
          type: "string"
          enum: ["requirement", "specification", "task_plan", "test_contract", "implementation"]
        verdict: { type: "string", enum: ["pass", "fail"] }
        findings:
          type: "array"
          items: { type: "string" }
