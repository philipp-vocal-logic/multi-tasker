# Architecture & Layer Boundary Policy
# Enforced deterministically by `mt check architecture` via Python stdlib `ast` import-graph analysis.
version: 1

dependency_rules:
  forbid_circular_imports: true
  forbid_src_importing_tests: true

allowed_third_party_packages:
  # Stdlib-first; only stable, approved packages may be imported in src/**
  - "yaml"
  - "jsonschema"
  - "pytest"

layers:
  - name: "domain"
    description: "Pure data structures, artifact models, state machines, and domain errors."
    paths:
      - "src/domain/**"
    allowed_internal_imports:
      - "src.domain"
    forbidden_internal_imports:
      - "src.checkers"
      - "src.orchestrator"
      - "src.cli"
      - "tests"

  - name: "checkers"
    description: "Deterministic CLI validators (permissions, schemas, glossary, limits, clean_code, architecture, traceability)."
    paths:
      - "src/checkers/**"
    allowed_internal_imports:
      - "src.domain"
      - "src.checkers"
    forbidden_internal_imports:
      - "src.orchestrator"
      - "src.cli"
      - "tests"

  - name: "orchestrator"
    description: "Clean Worktree manager, MergeGate runner, parallel Task scheduler, and Escalation router."
    paths:
      - "src/orchestrator/**"
    allowed_internal_imports:
      - "src.domain"
      - "src.checkers"
      - "src.orchestrator"
    forbidden_internal_imports:
      - "src.cli"
      - "tests"

  - name: "cli"
    description: "Thin CLI entrypoints (`mt init`, `mt check`, `mt intent`, `mt approve`, `mt run`, `mt resolve`, `mt trace`)."
    paths:
      - "src/cli/**"
    allowed_internal_imports:
      - "src.domain"
      - "src.checkers"
      - "src.orchestrator"
      - "src.cli"
    forbidden_internal_imports:
      - "tests"

  - name: "tests"
    description: "Executable TestContracts decorated with @traces(REQ, AC, SPEC)."
    paths:
      - "tests/**"
    allowed_internal_imports:
      - "src.domain"
      - "src.checkers"
      - "src.orchestrator"
      - "src.cli"
      - "tests"
    forbidden_internal_imports: []
