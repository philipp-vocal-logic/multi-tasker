# Code Quality, Typing & KISS/YAGNI Policy
# Enforced deterministically by `mt check clean_code` wrapping `ruff`, `mypy`, and Python `ast` visitors.
version: 1
language: "python"
source_extensions:
  - ".py"

output_contract:
  silent_on_pass: true
  finding_format: "{path}:{line}: [{rule_id}] {message}"

linters:
  ruff:
    enabled: true
    cmd: ["ruff", "check", "--output-format=concise", "--quiet"]
    format_cmd: ["ruff", "format", "--quiet"]
    select_rules:
      - "E"     # pycodestyle errors
      - "F"     # Pyflakes (unused imports/variables, undefined names)
      - "B"     # flake8-bugbear
      - "C90"   # McCabe cyclomatic complexity
      - "N"     # pep8-naming (clean descriptive identifier conventions)
      - "UP"    # pyupgrade
      - "SIM"   # flake8-simplify (KISS enforcement)
      - "ARG"   # flake8-unused-arguments (YAGNI enforcement)
      - "ERA"   # eradicate (forbid commented-out dead code)
      - "ANN"   # flake8-annotations (enforce type annotations)
    max_mccabe_complexity: 8

  mypy:
    enabled: true
    cmd:
      - "mypy"
      - "--strict"
      - "--no-error-summary"
      - "--hide-error-context"
      - "--no-pretty"

ast_rules:
  forbid_todo_fixme_comments: true
  forbidden_comment_markers: ["TODO", "FIXME", "HACK", "XXX"]
  forbid_bare_except: true
  forbid_pass_only_functions_in_src: true   # Prevents stubbed/unimplemented methods in src/**
  forbidden_calls_in_src: ["print"]         # Enforces structured/quiet CLI output
  require_explicit_return_types: true
  min_identifier_length: 3
  allowed_single_char_names: ["_"]

remediation:
  CODE_C901: "Reduce branching complexity by extracting helper functions or using early returns; never inline or compact logic."
  CODE_SHORT_IDENT: "Rename the identifier to a descriptive full English word of at least 3 characters."
  CODE_STUB_FUNCTION: "Provide a complete implementation instead of a pass or ellipsis stub."
  CODE_MISSING_RETURN_TYPE: "Add an explicit return type annotation (e.g., -> None) to the function signature."
